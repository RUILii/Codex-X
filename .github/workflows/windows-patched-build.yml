name: build patched windows exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build codex-x.exe
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --dir apps/desktop build:renderer

      - name: Build release binary
        run: cargo build --release --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Inspect binary
        run: Get-Item apps/desktop/src-tauri/target/release/codex-x.exe | Format-List Name,Length,LastWriteTime

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: codex-x-windows-patched
          path: apps/desktop/src-tauri/target/release/codex-x.exe
          if-no-files-found: error
          retention-days: 7
