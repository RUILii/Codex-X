name: build patched windows exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build codex-x.exe
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release binary with tauri cli
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'bundle-check.json'
          Set-Content -Path $config -Value '{"bundle":{"createUpdaterArtifacts":false}}' -Encoding utf8
          pnpm --dir apps/desktop tauri build --no-bundle --config $config --ci

      - name: Verify binary embeds frontend and patch
        run: |
          $exe = 'apps/desktop/src-tauri/target/release/codex-x.exe'
          if (-not (Test-Path $exe)) { throw "missing binary: $exe" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          Get-Item $exe | Format-List Name, Length, LastWriteTime
          if ($text -notmatch 'assets/index') {
            throw 'frontend assets are not embedded: binary would fall back to devUrl 127.0.0.1:1420'
          }
          if ($text -notmatch '正被 Codex 占用') {
            throw 'the windows session lock patch is missing from the binary'
          }
          Write-Output 'checks passed: embedded assets + windows lock patch present'

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: codex-x-windows-patched
          path: apps/desktop/src-tauri/target/release/codex-x.exe
          if-no-files-found: error
          retention-days: 7
